# =============================================================================
# SmartSeed Hyperledger Fabric Network - Docker Compose
# Development environment with Fabric 2.5
# =============================================================================

version: "3.8"

volumes:
  orderer.smartseed.com:
  peer0.manufacturer.smartseed.com:
  peer0.regulator.smartseed.com:
  couchdb0_data:
  couchdb1_data:

networks:
  smartseed_fabric_network:
    name: smartseed_fabric_network
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Orderer Node (Raft consensus, single node for development)
  # ---------------------------------------------------------------------------
  orderer.smartseed.com:
    container_name: orderer.smartseed.com
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ../crypto-config/ordererOrganizations/smartseed.com/orderers/orderer.smartseed.com/msp:/var/hyperledger/orderer/msp
      - ../crypto-config/ordererOrganizations/smartseed.com/orderers/orderer.smartseed.com/tls:/var/hyperledger/orderer/tls
      - orderer.smartseed.com:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # CouchDB for Manufacturer Peer
  # ---------------------------------------------------------------------------
  couchdb0:
    container_name: couchdb0
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=smartseedadmin
      - COUCHDB_PASSWORD=smartseedpw
    volumes:
      - couchdb0_data:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # Peer0 - Manufacturer Organization (Org1)
  # ---------------------------------------------------------------------------
  peer0.manufacturer.smartseed.com:
    container_name: peer0.manufacturer.smartseed.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=smartseed_fabric_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.manufacturer.smartseed.com
      - CORE_PEER_ADDRESS=peer0.manufacturer.smartseed.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.manufacturer.smartseed.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.manufacturer.smartseed.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.manufacturer.smartseed.com:7051
      - CORE_PEER_LOCALMSPID=ManufacturerMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # CouchDB settings
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=smartseedadmin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=smartseedpw
    depends_on:
      - couchdb0
      - orderer.smartseed.com
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../crypto-config/peerOrganizations/manufacturer.smartseed.com/peers/peer0.manufacturer.smartseed.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/manufacturer.smartseed.com/peers/peer0.manufacturer.smartseed.com/tls:/etc/hyperledger/fabric/tls
      - peer0.manufacturer.smartseed.com:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # CouchDB for Regulator Peer
  # ---------------------------------------------------------------------------
  couchdb1:
    container_name: couchdb1
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=smartseedadmin
      - COUCHDB_PASSWORD=smartseedpw
    volumes:
      - couchdb1_data:/opt/couchdb/data
    ports:
      - "6984:5984"
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # Peer0 - Regulator Organization (Org2)
  # ---------------------------------------------------------------------------
  peer0.regulator.smartseed.com:
    container_name: peer0.regulator.smartseed.com
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=smartseed_fabric_network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.regulator.smartseed.com
      - CORE_PEER_ADDRESS=peer0.regulator.smartseed.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.smartseed.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.smartseed.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.smartseed.com:9051
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # CouchDB settings
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=smartseedadmin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=smartseedpw
    depends_on:
      - couchdb1
      - orderer.smartseed.com
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../crypto-config/peerOrganizations/regulator.smartseed.com/peers/peer0.regulator.smartseed.com/msp:/etc/hyperledger/fabric/msp
      - ../crypto-config/peerOrganizations/regulator.smartseed.com/peers/peer0.regulator.smartseed.com/tls:/etc/hyperledger/fabric/tls
      - peer0.regulator.smartseed.com:/var/hyperledger/production
    ports:
      - "9051:9051"
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # Certificate Authority - Manufacturer Organization
  # ---------------------------------------------------------------------------
  ca.manufacturer.smartseed.com:
    container_name: ca.manufacturer.smartseed.com
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-manufacturer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.manufacturer.smartseed.com-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/priv_sk
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-config/peerOrganizations/manufacturer.smartseed.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - smartseed_fabric_network

  # ---------------------------------------------------------------------------
  # Certificate Authority - Regulator Organization
  # ---------------------------------------------------------------------------
  ca.regulator.smartseed.com:
    container_name: ca.regulator.smartseed.com
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-regulator
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/fabric-ca-server-config/ca.regulator.smartseed.com-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/fabric-ca-server-config/priv_sk
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../crypto-config/peerOrganizations/regulator.smartseed.com/ca/:/etc/hyperledger/fabric-ca-server-config
    networks:
      - smartseed_fabric_network
